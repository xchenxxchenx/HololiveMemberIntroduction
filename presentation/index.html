<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hololive Production 藝人介紹簡報 (Talents Showcase)</title>
  <style>
    :root {
      --bg-dark: #0b0f19;
      --card-bg: rgba(18, 26, 45, 0.92);
      --card-border: rgba(39, 199, 254, 0.3);
      --accent-cyan: #27c7fe;
      --accent-pink: #ff66ab;
      --accent-purple: #9d4edd;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100vh;
      overflow: hidden;
      background-color: var(--bg-dark);
      color: var(--text-main);
      font-family: var(--font-family);
      user-select: none;
    }

    body {
      display: flex;
      flex-direction: column;
      background-image: 
        radial-gradient(circle at 10% 20%, rgba(39, 199, 254, 0.12) 0%, transparent 45%),
        radial-gradient(circle at 90% 80%, rgba(255, 102, 171, 0.12) 0%, transparent 45%),
        radial-gradient(circle at 50% 50%, rgba(157, 78, 221, 0.08) 0%, transparent 60%);
    }

    /* Top Navigation Header */
    header {
      height: 56px;
      flex-shrink: 0;
      padding: 0 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      background: rgba(11, 15, 25, 0.95);
      backdrop-filter: blur(12px);
      z-index: 50;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      font-weight: 700;
      font-size: 1.1rem;
      letter-spacing: 0.5px;
    }

    .brand .logo-holo {
      color: var(--accent-cyan);
      text-shadow: 0 0 12px rgba(39, 199, 254, 0.6);
    }

    .brand .logo-tag {
      font-size: 0.75rem;
      padding: 2px 8px;
      border-radius: 9999px;
      background: rgba(39, 199, 254, 0.15);
      color: var(--accent-cyan);
      border: 1px solid rgba(39, 199, 254, 0.3);
    }

    .nav-controls {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    select, input {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.18);
      color: var(--text-main);
      padding: 6px 14px;
      border-radius: 8px;
      font-size: 0.88rem;
      outline: none;
      transition: all 0.2s;
    }

    select:focus, input:focus {
      border-color: var(--accent-cyan);
      box-shadow: 0 0 8px rgba(39, 199, 254, 0.3);
    }

    select option {
      background: #111827;
      color: #fff;
    }

    .btn {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.18);
      color: var(--text-main);
      padding: 6px 14px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.88rem;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
    }

    .btn:hover {
      background: rgba(39, 199, 254, 0.25);
      border-color: var(--accent-cyan);
      color: var(--accent-cyan);
    }

    /* Main Presentation Container */
    main {
      flex: 1;
      min-height: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 12px 24px;
      overflow: hidden;
      position: relative;
    }

    .slide-viewport {
      width: 100%;
      max-width: 1320px;
      height: 100%;
      max-height: 100%;
      display: flex;
      align-items: stretch;
      justify-content: center;
      min-height: 0;
    }

    /* Solid Slide Card - Responsive and auto scrollable */
    .slide-card {
      display: none;
      width: 100%;
      height: 100%;
      max-height: 100%;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      backdrop-filter: blur(24px);
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.1);
      grid-template-columns: 320px 1fr;
      grid-template-rows: 100%;
      overflow: hidden;
      min-height: 0;
    }

    .slide-card.active {
      display: grid;
      animation: fadeInSlide 0.25s ease-out;
    }

    @keyframes fadeInSlide {
      from {
        opacity: 0;
        transform: translateY(8px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* Left Column: Portrait & Identity */
    .portrait-col {
      background: linear-gradient(180deg, rgba(39, 199, 254, 0.1) 0%, rgba(15, 23, 42, 0.85) 100%);
      border-right: 1px solid rgba(255, 255, 255, 0.1);
      padding: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      overflow-y: auto;
      gap: 12px;
      min-height: 0;
    }

    .avatar-wrapper {
      width: 200px;
      height: 250px;
      border-radius: 16px;
      overflow: hidden;
      position: relative;
      background: radial-gradient(circle, rgba(39, 199, 254, 0.2) 0%, rgba(0, 0, 0, 0.5) 100%);
      border: 2px solid rgba(39, 199, 254, 0.4);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
      flex-shrink: 0;
    }

    .avatar-wrapper img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: top center;
      display: block;
    }

    .status-badge {
      position: absolute;
      top: 8px;
      right: 8px;
      padding: 3px 8px;
      border-radius: 9999px;
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      z-index: 2;
    }

    .status-active {
      background: rgba(16, 185, 129, 0.35);
      color: #34d399;
      border: 1px solid rgba(16, 185, 129, 0.6);
      box-shadow: 0 0 10px rgba(16, 185, 129, 0.4);
    }

    .status-graduate {
      background: rgba(168, 85, 247, 0.35);
      color: #c084fc;
      border: 1px solid rgba(168, 85, 247, 0.6);
      box-shadow: 0 0 10px rgba(168, 85, 247, 0.4);
    }

    .status-breakoff {
      background: rgba(245, 158, 11, 0.35);
      color: #fbbf24;
      border: 1px solid rgba(245, 158, 11, 0.6);
      box-shadow: 0 0 10px rgba(245, 158, 11, 0.4);
    }

    .status-resign {
      background: rgba(14, 165, 233, 0.35);
      color: #38bdf8;
      border: 1px solid rgba(14, 165, 233, 0.6);
      box-shadow: 0 0 10px rgba(14, 165, 233, 0.4);
    }

    .oshi-mark-badge {
      position: absolute;
      bottom: 8px;
      left: 8px;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(8px);
      padding: 3px 8px;
      border-radius: 8px;
      font-size: 1.1rem;
      border: 1px solid rgba(255, 255, 255, 0.15);
      z-index: 2;
    }

    .meta-list {
      width: 100%;
      font-size: 0.82rem;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .meta-item {
      display: flex;
      justify-content: space-between;
      padding: 6px 10px;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.06);
    }

    .meta-label {
      color: var(--text-muted);
    }

    .meta-value {
      font-weight: 600;
      color: var(--text-main);
      text-align: right;
    }

    /* Right Column: Detailed Presentation Content */
    .content-col {
      padding: 24px 32px;
      display: flex;
      flex-direction: column;
      overflow-y: auto;
      gap: 16px;
      min-height: 0;
      height: 100%;
    }

    .talent-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      padding-bottom: 12px;
      gap: 16px;
    }

    .name-title-group h1 {
      font-size: 2.1rem;
      font-weight: 800;
      color: #fff;
      display: flex;
      align-items: baseline;
      gap: 12px;
      letter-spacing: -0.5px;
      line-height: 1.2;
    }

    .name-en-sub {
      font-size: 1.15rem;
      color: var(--accent-cyan);
      font-weight: 600;
    }

    .name-jp-sub {
      font-size: 0.95rem;
      color: var(--text-muted);
      margin-top: 4px;
    }

    .gen-badge-group {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 6px;
      flex-shrink: 0;
    }

    .branch-pill {
      background: linear-gradient(135deg, var(--accent-cyan), #0077b6);
      color: #fff;
      font-size: 0.75rem;
      font-weight: 700;
      padding: 4px 12px;
      border-radius: 9999px;
      text-transform: uppercase;
      box-shadow: 0 4px 10px rgba(39, 199, 254, 0.3);
    }

    .gen-pill {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #e2e8f0;
      font-size: 0.8rem;
      padding: 3px 10px;
      border-radius: 9999px;
      font-weight: 600;
      white-space: nowrap;
    }

    /* Greetings Box */
    .greetings-box {
      background: rgba(39, 199, 254, 0.06);
      border-left: 4px solid var(--accent-cyan);
      padding: 10px 16px;
      border-radius: 0 10px 10px 0;
      display: flex;
      flex-direction: column;
      gap: 4px;
      font-size: 0.9rem;
    }

    .greeting-line {
      display: flex;
      align-items: baseline;
      gap: 8px;
    }

    .greeting-tag {
      font-size: 0.7rem;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 4px;
      background: rgba(39, 199, 254, 0.25);
      color: var(--accent-cyan);
      flex-shrink: 0;
    }

    /* Section Boxes */
    .section-box {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .section-title {
      font-size: 0.9rem;
      font-weight: 700;
      color: var(--accent-pink);
      text-transform: uppercase;
      letter-spacing: 0.8px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .section-title::before {
      content: "";
      width: 4px;
      height: 13px;
      background: var(--accent-pink);
      border-radius: 2px;
    }

    .section-body {
      font-size: 0.92rem;
      line-height: 1.55;
      color: #cbd5e1;
    }

    /* Song Tags */
    .songs-container {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .song-pill {
      background: rgba(255, 102, 171, 0.12);
      border: 1px solid rgba(255, 102, 171, 0.35);
      color: #ffd1dc;
      padding: 3px 10px;
      border-radius: 9999px;
      font-size: 0.82rem;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .song-pill::before {
      content: "🎵";
      font-size: 0.72rem;
    }

    /* Meme Box */
    .meme-highlight {
      background: rgba(157, 78, 221, 0.1);
      border: 1px solid rgba(157, 78, 221, 0.3);
      border-radius: 10px;
      padding: 10px 16px;
      font-size: 0.9rem;
      line-height: 1.5;
      color: #e9d5ff;
    }

    /* Footer Navigation */
    footer {
      height: 60px;
      flex-shrink: 0;
      background: rgba(11, 15, 25, 0.95);
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 32px;
      position: relative;
      z-index: 50;
    }

    .progress-bar {
      position: absolute;
      top: 0;
      left: 0;
      height: 3px;
      background: linear-gradient(90deg, var(--accent-cyan), var(--accent-pink));
      box-shadow: 0 0 10px rgba(39, 199, 254, 0.8);
      transition: width 0.25s ease;
    }

    .slide-info {
      display: flex;
      align-items: center;
      gap: 16px;
      font-size: 0.92rem;
      font-weight: 600;
    }

    .current-slide-num {
      color: var(--accent-cyan);
      font-size: 1.25rem;
      font-weight: 800;
    }

    .nav-buttons {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .arrow-btn {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #fff;
      width: 42px;
      height: 42px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 1.15rem;
      transition: all 0.2s;
    }

    .arrow-btn:hover:not(:disabled) {
      background: var(--accent-cyan);
      color: #000;
      box-shadow: 0 0 15px rgba(39, 199, 254, 0.5);
      border-color: var(--accent-cyan);
    }

    .arrow-btn:disabled {
      opacity: 0.25;
      cursor: not-allowed;
    }

    .hint-keys {
      font-size: 0.8rem;
      color: var(--text-muted);
      display: flex;
      gap: 6px;
      align-items: center;
    }

    .key-badge {
      background: rgba(255, 255, 255, 0.1);
      padding: 2px 6px;
      border-radius: 4px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      font-family: monospace;
    }

    /* Drawer Modal */
    .drawer {
      position: fixed;
      top: 56px;
      bottom: 60px;
      left: 0;
      width: 320px;
      background: rgba(15, 23, 42, 0.98);
      backdrop-filter: blur(16px);
      border-right: 1px solid rgba(255, 255, 255, 0.12);
      transform: translateX(-100%);
      transition: transform 0.25s ease;
      z-index: 100;
      display: flex;
      flex-direction: column;
      padding: 16px;
    }

    .drawer.open {
      transform: translateX(0);
      box-shadow: 20px 0 50px rgba(0, 0, 0, 0.7);
    }

    .drawer-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      font-weight: 700;
      color: var(--accent-cyan);
    }

    .drawer-list {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .drawer-item {
      padding: 8px 12px;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.88rem;
      transition: all 0.15s;
    }

    .drawer-item:hover, .drawer-item.active {
      background: rgba(39, 199, 254, 0.2);
      color: var(--accent-cyan);
    }

    /* Custom Scrollbar */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: rgba(0, 0, 0, 0.2);
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.2);
      border-radius: 3px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: rgba(39, 199, 254, 0.5);
    }
  </style>
</head>

  <!-- Top Navigation -->
  <header>
    <div class="brand">
      <span class="logo-holo">HOLOLIVE PRODUCTION</span>
      <span>藝人介紹簡報</span>

  </header>

  <!-- Sidebar Directory Drawer -->
  <div class="drawer" id="talentDrawer">

    <div class="drawer-list" id="drawerList"></div>
  </div>

  <!-- Main Slide Display Area -->
  <main>

  <!-- Footer Navigation Controls -->

      <div style="color: var(--text-muted); font-size: 0.88rem;" id="slideGenLabel">Hololive JP | 0th Generation</div>

    <div class="hint-keys">

    <div class="nav-buttons">
      <button class="arrow-btn" id="btnPrev" title="上一頁 (Left Arrow)">◀</button>
      <button class="arrow-btn" id="btnNext" title="下一頁 (Right Arrow)">▶</button>
    </div>
  </footer>

    const slideGenLabel = document.getElementById('slideGenLabel');
    const progressBar = document.getElementById('progressBar');

    // Populate Generation Select
    GENS.forEach(g => {
      const opt = document.createElement('option');
      opt.value = g.first_slide - 1;
      opt.textContent = `${g.branch} - ${g.generation}`;
      genSelect.appendChild(opt);
    });

    genSelect.addEventListener('change', (e) => {
      if (e.target.value !== "") {
        goToSlide(parseInt(e.target.value));
        genSelect.value = "";
      }
    });

    // Build Single Slide Card HTML (Only active slide is rendered or shown)
    function renderCard(s) {
      let statusClass = 'status-active';
      let statusText = '現役 (ACTIVE)';
      if (s.status === 'graduate') {
        statusClass = 'status-graduate';
        statusText = `卒業 (${s.graduation_date || 'GRADUATED'})`;
      } else if (s.status === 'Breakoff') {
        statusClass = 'status-breakoff';
        statusText = `契約終了 (${s.graduation_date || 'BREAKOFF'})`;
      } else if (s.status === 'resign') {
        statusClass = 'status-resign';
        statusText = `退職 (${s.graduation_date || 'RESIGNED'})`;
      }

      const songsHtml = (s.songs && s.songs.length > 0)
        ? s.songs.map(song => `<span class="song-pill">${song}</span>`).join('')
        : '<span style="color: var(--text-muted); font-size: 0.85rem;">暫無專屬原創代表曲記錄</span>';

      return `
        <div class="slide-card active">
          <!-- Left Column -->
          <div class="portrait-col">
            <div class="avatar-wrapper">
              <img src="${s.image}" alt="${s.name_en}" onerror="this.src='../asset/picture/hololive/head_l_in_rnew.png'">
              <div class="status-badge ${statusClass}">${statusText}</div>
              <div class="oshi-mark-badge" title="推特標誌符號">${s.oshi_mark}</div>

                <span class="meta-value">${s.debut_date}</span>

              <div class="meta-item">
                <span class="meta-label">粉絲名稱</span>
                <span class="meta-value">${s.fan_name}</span>
              </div>
              <div class="meta-item">
                <span class="meta-label">擔綱繪師</span>
                <span class="meta-value">${s.illustrator}</span>
              </div>
              <div class="meta-item">
                <span class="meta-label">推特符號</span>
                <span class="meta-value">${s.oshi_mark}</span>
              </div>
            </div>
          </div>

          <!-- Right Column -->
          <div class="content-col">
            <div class="talent-header">
              <div class="name-title-group">
                <h1>
                  ${s.name_zh}
                  <span class="name-en-sub">${s.name_en}</span>
                </h1>
                <div class="name-jp-sub">${s.name_jp}</div>
              </div>

              <div class="gen-badge-group">
                <span class="branch-pill">${s.branch}</span>
                <span class="gen-pill">${s.generation}</span>
              </div>
            </div>

            <!-- Greetings Box -->
            <div class="greetings-box">
              <div class="greeting-line">
                <span class="greeting-tag">開場問候</span>
                <span>「${s.opening_greeting}」</span>
              </div>
              <div class="greeting-line">
                <span class="greeting-tag">結尾問候</span>
                <span style="color: #94a3b8;">「${s.closing_greeting}」</span>
              </div>
            </div>

            <!-- Features & Bio -->
            <div class="section-box">
              <div class="section-title">藝人簡介與演藝特色</div>
              <div class="section-body">${s.desc} ${s.features}</div>
            </div>

            <!-- Representative Songs -->
            <div class="section-box">
              <div class="section-title">代表音樂作品</div>
              <div class="songs-container">${songsHtml}</div>
            </div>

            <!-- Units & Relations -->
            <div class="section-box">
              <div class="section-title">主要搭檔與連動關係</div>
              <div class="section-body">${s.relations}</div>
            </div>

            <!-- Memes & Lore -->
            <div class="section-box">
              <div class="section-title">社內名梗與傳奇名言</div>
              <div class="meme-highlight">${s.memes}</div>
            </div>
          </div>
        </div>
      `;
    }

    // Switch to Slide
    function goToSlide(newIndex) {
      if (newIndex < 0 || newIndex >= totalSlides) return;
      currentIndex = newIndex;
      const s = SLIDES[currentIndex];

      // Re-render viewport with the new active slide (Instant, clean, 0 layout conflict)
      viewport.innerHTML = renderCard(s);

      // Update footer controls
      slideNum.textContent = s.index;
      slideGenLabel.textContent = `${s.branch} | ${s.generation}`;
      progressBar.style.width = `${(s.index / totalSlides) * 100}%`;

      btnPrev.disabled = currentIndex === 0;
      btnNext.disabled = currentIndex === totalSlides - 1;

      // Update Drawer active item
      document.querySelectorAll('.drawer-item').forEach((el, idx) => {
        el.classList.toggle('active', idx === currentIndex);
      });
    }

    // Drawer Directory list render
    function renderDrawerList(filter = '') {
      drawerList.innerHTML = '';
      SLIDES.forEach((s, idx) => {
        const searchTarget = `${s.name_zh} ${s.name_en} ${s.name_jp} ${s.generation}`.toLowerCase();
        if (filter && !searchTarget.includes(filter.toLowerCase())) return;

        const item = document.createElement('div');
        item.className = `drawer-item ${idx === currentIndex ? 'active' : ''}`;
        item.innerHTML = `
          <span><b>${s.index}.</b> ${s.name_zh}</span>
          <span style="font-size: 0.72rem; color: var(--text-muted);">${s.generation.split(' ')[0]}</span>
        `;
        item.addEventListener('click', () => {
          goToSlide(idx);
          talentDrawer.classList.remove('open');
        });
        drawerList.appendChild(item);
      });
    }

    drawerSearch.addEventListener('input', (e) => {
      renderDrawerList(e.target.value);
    });

    btnToggleDrawer.addEventListener('click', () => {
      talentDrawer.classList.toggle('open');
      drawerSearch.focus();
    });

    btnCloseDrawer.addEventListener('click', () => {
      talentDrawer.classList.remove('open');
    });

    // Fullscreen toggle
    btnFullscreen.addEventListener('click', () => {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(() => {});
      } else {
        if (document.exitFullscreen) {
          document.exitFullscreen();
        }
      }
    });

    // Navigation events
    btnPrev.addEventListener('click', () => goToSlide(currentIndex - 1));
    btnNext.addEventListener('click', () => goToSlide(currentIndex + 1));

    document.addEventListener('keydown', (e) => {
      if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;

      if (e.key === 'ArrowRight' || e.key === ' ' || e.key === 'PageDown') {
        e.preventDefault();
        goToSlide(currentIndex + 1);
      } else if (e.key === 'ArrowLeft' || e.key === 'PageUp') {
        e.preventDefault();
        goToSlide(currentIndex - 1);
      } else if (e.key === 'Home') {
        e.preventDefault();
        goToSlide(0);
      } else if (e.key === 'End') {
        e.preventDefault();
        goToSlide(totalSlides - 1);
      }
    });

    // Initialize
    renderDrawerList();
    goToSlide(0);
  </script>
